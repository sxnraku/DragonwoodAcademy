
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1e293b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dragonwood Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Lora:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Lora', serif;
      }
      .font-medieval {
        font-family: 'MedievalSharp', cursive;
      }
      @keyframes floatDamage {
        0% { opacity: 0; transform: translateY(0) scale(0.6); }
        20% { opacity: 1; transform: translateY(-18px) scale(1.3); }
        80% { opacity: 1; transform: translateY(-38px) scale(1); }
        100% { opacity: 0; transform: translateY(-55px) scale(0.8); }
      }
      .animate-float-damage {
        animation: floatDamage 1.2s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
      }
      @keyframes hitShake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-10px) rotate(-3deg); filter: brightness(1.6) drop-shadow(0 0 15px rgba(239,68,68,0.8)); }
        40% { transform: translateX(10px) rotate(3deg); filter: brightness(1.8) drop-shadow(0 0 20px rgba(239,68,68,0.9)); }
        60% { transform: translateX(-6px); }
        80% { transform: translateX(6px); }
      }
      .animate-hit-shake {
        animation: hitShake 0.45s ease-in-out;
      }
      @keyframes slashEffect {
        0% { opacity: 0; transform: scale(0.2) rotate(-40deg); }
        40% { opacity: 1; transform: scale(1.4) rotate(0deg); }
        100% { opacity: 0; transform: scale(1.8) rotate(20deg); }
      }
      .animate-slash-effect {
        animation: slashEffect 0.4s ease-out forwards;
      }
      @keyframes pulseGlow {
        0%, 100% { box-shadow: 0 0 15px rgba(234, 179, 8, 0.4); }
        50% { box-shadow: 0 0 35px rgba(234, 179, 8, 0.9); }
      }
      .animate-pulse-glow {
        animation: pulseGlow 1.5s infinite;
      }
    </style>

</html>
